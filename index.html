<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDoctorG — Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box}
body{margin:0;overflow-x:hidden;transition:.4s;min-height:100vh;display:flex;flex-direction:column}
.ambient{position:fixed;inset:0;z-index:-2;transition:.4s}
.dark .ambient{background:radial-gradient(circle at 15% 15%,rgba(16,185,129,.15),transparent 40%),radial-gradient(circle at 85% 85%,rgba(59,130,246,.12),transparent 40%),#070b14}
html:not(.dark) .ambient{background:radial-gradient(circle at 15% 15%,rgba(16,185,129,.1),transparent 40%),#f1f5f9}
.glass{backdrop-filter:blur(24px);border-radius:1.5rem;transition:.3s}
.dark .glass{background:rgba(13,20,38,.85);border:1px solid rgba(255,255,255,.08);box-shadow:0 25px 50px -12px rgba(0,0,0,.6);color:#f8fafc}
html:not(.dark) .glass{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.06);box-shadow:0 20px 40px -15px rgba(0,0,0,.08);color:#0f172a}
.ibox{transition:.25s}
.dark .ibox{background:rgba(4,9,23,.7);border:1px solid rgba(51,65,85,.6);color:#f8fafc}
.dark .ibox:focus{border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18);background:rgba(4,9,23,.9)}
html:not(.dark) .ibox{background:#f8fafc;border:1px solid #cbd5e1;color:#0f172a}
html:not(.dark) .ibox:focus{border-color:#059669;box-shadow:0 0 0 4px rgba(5,150,105,.12);background:#fff}
</style>
</head>
<body class="antialiased text-slate-800 dark:text-slate-100 selection:bg-emerald-500 selection:text-white justify-between">
<div class="ambient"></div>
<header class="sticky top-0 z-40 backdrop-blur-2xl border-b transition dark:bg-slate-950/75 dark:border-slate-800/80 bg-white/75 border-slate-200/80">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/25"><i class="fa-solid fa-heart-pulse"></i></div>
<div>
<h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">MyDoctorG</h1>
<p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 tracking-wider uppercase">Healthcare At Your Fingertips</p>
</div>
</div>
<button onclick="document.documentElement.classList.toggle('dark')" class="w-10 h-10 rounded-xl flex items-center justify-center border transition dark:bg-slate-900 dark:border-slate-700 dark:text-amber-400 bg-slate-100 border-slate-200 text-indigo-600"><i class="fa-solid fa-moon"></i></button>
</div>
</header>
<main class="flex-1 max-w-lg mx-auto w-full px-4 py-10 flex items-center justify-center">
<div class="glass p-8 sm:p-10 w-full space-y-6 border border-emerald-500/20 shadow-2xl">
<div class="text-center space-y-1">
<h2 class="text-2xl font-extrabold tracking-tight">Create Account</h2>
<p class="text-xs font-semibold text-slate-400">Join MyDoctorG intelligent health suite</p>
</div>
<form onsubmit="handleSignup(event)" class="space-y-4">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="fullname">Full Name</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-user"></i></span>
<input type="text" id="fullname" name="name" autocomplete="name" placeholder="John Doe" pattern="[A-Za-z\s]{2,50}" minlength="2" maxlength="50" oninput="this.value=this.value.replace(/[^A-Za-z\s]/g,'')" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none" title="Only letters and spaces allowed (2–50 characters)"></div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="age">Age</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-calendar"></i></span>
<input type="number" id="age" name="age" placeholder="e.g., 20" min="15" max="120" step="1" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none"></div>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="email">Email Address</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-envelope"></i></span>
<input type="email" id="email" name="email" autocomplete="email" placeholder="boss@mydoctorg.com" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none"></div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="phone">Phone Number</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-phone"></i></span>
<input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none" title="Enter a valid 10-digit Indian mobile number starting with 6–9"></div>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="blood">Blood Group</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-droplet"></i></span>
<select id="blood" name="blood" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none">
<option value="">Select Blood Group</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="O+">O+</option><option value="O-">O-</option>
</select></div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="emergency">Emergency Contact</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-phone-volume"></i></span>
<input type="tel" id="emergency" name="emergency" placeholder="10-digit emergency number" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required class="ibox w-full pl-10 pr-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none" title="Enter a valid 10-digit emergency mobile number starting with 6–9"></div>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="history">Medical History / Allergies <span class="text-slate-500 font-normal">(Optional)</span></label>
<textarea id="history" name="history" rows="2" maxlength="300" oninput="this.value=this.value.replace(/[^A-Za-z0-9\s,.\-\/()]/g,'')" placeholder="e.g., Asthma, Penicillin allergy, Type 2 Diabetes (or leave blank)" class="ibox w-full px-3.5 py-3 rounded-xl text-xs font-medium focus:outline-none resize-none"></textarea>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400" for="signupPassword">Password</label>
<div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs"><i class="fa-solid fa-lock"></i></span>
<input id="signupPassword" type="password" name="password" autocomplete="new-password" placeholder="••••••••" minlength="6" required class="ibox w-full pl-10 pr-12 py-3 rounded-xl text-xs font-medium focus:outline-none" title="Password must be at least 6 characters long">
<button type="button" onclick="togglePwd()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-emerald-500 transition"><i id="signupEye" class="fa-solid fa-eye text-xs"></i></button></div>
</div>
<button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-2"><i class="fa-solid fa-user-plus"></i> Create Account & Proceed</button>
</form>
</div>
</main>
<footer class="mt-auto py-6 border-t transition dark:bg-slate-950/60 dark:border-slate-900 bg-white/60 border-slate-200">
<div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400 font-medium">© 2026 MyDoctorG Healthcare Systems. All rights reserved.</div>
</footer>
<script>
function togglePwd(){
const p=document.getElementById('signupPassword'),e=document.getElementById('signupEye');
p.type=p.type==='password'?'text':'password';
e.className=p.type==='password'?'fa-solid fa-eye text-xs':'fa-solid fa-eye-slash text-xs';
}
function handleSignup(e){
e.preventDefault();

const name = document.getElementById('fullname').value.trim().replace(/\s+/g, ' ');
const age = Number(document.getElementById('age').value);
const email = document.getElementById('email').value.trim();
const phone = document.getElementById('phone').value.trim();
const blood = document.getElementById('blood').value;
const emergency = document.getElementById('emergency').value.trim();
const history = document.getElementById('history').value.trim();
const password = document.getElementById('signupPassword').value;

if (!/^[A-Za-z\s]{2,50}$/.test(name)) {
    alert("Full Name must contain only letters and spaces (2–50 characters).");
    return;
}
if (!Number.isInteger(age) || age < 15 || age > 120) {
    alert("Please enter a valid whole age between 15 and 120.");
    return;
}
if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return;
}
if (!/^[6-9]\d{9}$/.test(phone) || /^(\d)\1{9}$/.test(phone)) {
    alert("Please enter a valid 10-digit mobile number.");
    return;
}
if (!blood || blood === "Unknown") {
    alert("Please select your blood group.");
    return;
}
if (!/^[6-9]\d{9}$/.test(emergency) || /^(\d)\1{9}$/.test(emergency)) {
    alert("Please enter a valid 10-digit emergency contact number.");
    return;
}
if (phone === emergency) {
    alert("Phone number and Emergency contact number cannot be the same.");
    return;
}
if (history && (!/[A-Za-z]{2,}/.test(history) || history.length < 3)) {
    alert("Please enter valid medical history/allergies in words (e.g., Asthma, None), or leave it blank.");
    return;
}
if (password.length < 6) {
    alert("Password must be at least 6 characters long.");
    return;
}

const profile={
name:name,
email:email,
age:age,
phone:phone,
blood:blood,
emergency:emergency,
history:history || "None"
};
localStorage.setItem('mydoctorg_profile',JSON.stringify(profile));
window.location.href="New.html";
}
</script>
</body>
</html>
