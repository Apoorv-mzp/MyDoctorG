<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDoctorG - AI Health Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-950 via-[#090d16] to-[#090d16] text-slate-100 min-h-screen font-sans pb-10">
  <div class="max-w-xl mx-auto px-4 pt-6">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">🩺 MyDoctorG</h1>
      <p class="text-xs text-slate-400">AI-POWERED HEALTHCARE ASSISTANT & SPECIALIST FINDER</p>
    </header>
    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 p-5 rounded-2xl shadow-xl mb-6">
      <h2 class="text-base font-bold mb-3 flex items-center gap-2 text-cyan-400"><i class="fa-solid fa-magnifying-glass"></i> Find Doctors & Specialists</h2>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <input id="c" value="Varanasi" placeholder="City" class="bg-slate-950 border border-slate-700/70 p-2.5 rounded-xl text-sm outline-none focus:border-cyan-400">
        <input id="d" value="Fever" placeholder="Symptom" class="bg-slate-950 border border-slate-700/70 p-2.5 rounded-xl text-sm outline-none focus:border-cyan-400">
      </div>
      <button id="s-btn" onclick="ai()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 py-2.5 rounded-xl font-semibold text-white shadow-lg shadow-indigo-600/30 hover:opacity-90 transition">Search Doctors</button>
      <div id="r" class="mt-4"></div>
    </div>
    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 p-5 rounded-2xl shadow-xl">
      <h2 class="text-base font-bold mb-3 flex items-center gap-2 text-indigo-400"><i class="fa-solid fa-robot"></i> AI Health Assistant</h2>
      <div id="chat" class="h-56 overflow-y-auto bg-slate-950/90 border border-slate-800/80 p-3 rounded-xl mb-3 flex flex-col gap-2.5 text-sm">
        <div class="bg-slate-800/90 p-3 rounded-2xl rounded-tl-sm max-w-[85%] text-slate-200">Hello! I am your MyDoctorG assistant. How can I help you today?</div>
      </div>
      <div class="flex gap-2">
        <input id="txt" placeholder="Ask a medical question..." onkeydown="if(event.key==='Enter')send()" class="flex-1 bg-slate-950 border border-slate-700/70 px-3 py-2.5 rounded-xl text-sm outline-none focus:border-indigo-400">
        <button onclick="send()" class="bg-indigo-600 hover:bg-indigo-500 px-4 rounded-xl text-white shadow-md shadow-indigo-600/30"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const K = "AQ.Ab8RN6JQBaIJVJ2Sb8g7aAvha_On_gz6Jw0cM4Xia3y5WqucwA", URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${K}`;
    let bp = null;
    async function callG(p) {
      let res = await fetch(URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) });
      if (!res.ok) throw new Error(); return res.json();
    }
    async function ai() {
      let c = document.getElementById("c").value, d = document.getElementById("d").value, rd = document.getElementById("r"), btn = document.getElementById("s-btn");
      if (!c || !d) return;
      btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>Wait a second AI is searching...`;
      rd.innerHTML = `<div class="text-cyan-400 text-xs py-3 text-center"><i class="fa-solid fa-circle-notch animate-spin mr-1"></i> Finding specialists...</div>`;
      try {
        let res = await callG({ contents: [{ parts: [{ text: `Provide 5 doctors for ${d} in ${c}, India. Return JSON ONLY: {"best_pick":{"doctor_name":"","specialty":"","hospital":"","address":"","reason":""},"facilities":[{"doctor_name":"","specialty":"","hospital":"","address":""}]}` }] }], generationConfig: { responseMimeType: "application/json" } });
        let js = JSON.parse(res.candidates[0].content.parts[0].text); bp = js.best_pick;
        rd.innerHTML = `<div class="bg-emerald-950/40 border border-emerald-500/40 p-3 rounded-xl mb-3"><div class="text-[10px] font-bold text-emerald-300 uppercase mb-1"><i class="fa-solid fa-star text-amber-400"></i> Top Pick</div><h3 class="font-bold text-emerald-200 text-sm">Dr. ${bp.doctor_name} (${bp.specialty})</h3><p class="text-xs text-slate-300 mt-1">${bp.hospital}, ${bp.address}</p><p class="text-xs text-emerald-300/90 mt-2 bg-emerald-900/30 p-2 rounded">${bp.reason}</p></div>` +
        `<div class="text-[11px] font-semibold text-slate-400 uppercase mb-2">Other Specialists</div>` +
        js.facilities.map(f => `<div class="bg-slate-950/80 border border-slate-800/80 p-2.5 rounded-xl mb-2"><h4 class="text-xs font-semibold text-indigo-300">Dr. ${f.doctor_name}</h4><span class="text-[10px] text-cyan-400">${f.specialty}</span><p class="text-[11px] text-slate-400 mt-0.5">${f.hospital}, ${f.address}</p></div>`).join('');
      } catch(e) { rd.innerHTML = `<div class="text-rose-400 text-xs p-2 bg-rose-950/30 rounded">Error loading recommendations.</div>`; }
      finally { btn.disabled = false; btn.innerHTML = `Search Doctors`; }
    }
    async function send() {
      let i = document.getElementById("txt"), m = i.value.trim(), b = document.getElementById("chat");
      if (!m) return;
      b.innerHTML += `<div class="bg-indigo-600 text-white p-2.5 rounded-2xl rounded-tr-sm max-w-[85%] self-end text-sm">${m}</div>`;
      i.value = ""; b.scrollTop = b.scrollHeight;
      let d = document.createElement("div"); d.className = "bg-slate-800/90 text-slate-300 p-2.5 rounded-2xl rounded-tl-sm max-w-[85%] text-sm"; d.innerHTML = `Thinking...`; b.appendChild(d); b.scrollTop = b.scrollHeight;
      try {
        let res = await callG({ systemInstruction: { parts: [{ text: `You are MyDoctorG AI. ${bp ? `Context: Dr. ${bp.doctor_name} (${bp.specialty}) at ${bp.hospital}.` : ''}` }] }, contents: [{ parts: [{ text: m }] }] });
        d.innerHTML = res.candidates[0].content.parts[0].text.replace(/\n/g, "<br>");
      } catch(e) { d.innerHTML = `<span class="text-rose-400">Connection error.</span>`; }
      b.scrollTop = b.scrollHeight;
    }
  </script>
</body>
</html>
