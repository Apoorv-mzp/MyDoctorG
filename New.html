<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDoctorG - AI Healthcare Platform</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
*{font-family:'Plus Jakarta Sans',system-ui,sans-serif}body{margin:0;overflow-x:hidden;transition:background-color .4s,color .4s;scroll-behavior:smooth}
.ambient-bg{position:fixed;inset:0;z-index:-2;transition:.4s}.dark .ambient-bg{background:radial-gradient(circle at 15% 15%,rgba(14,165,233,.18),transparent 45%),radial-gradient(circle at 85% 85%,rgba(99,102,241,.18),transparent 45%),radial-gradient(circle at 50% 50%,rgba(15,23,42,.96),rgba(3,7,18,1))}
html:not(.dark) .ambient-bg{background:radial-gradient(circle at 15% 15%,rgba(14,165,233,.08),transparent 45%),radial-gradient(circle at 85% 85%,rgba(99,102,241,.08),transparent 45%),radial-gradient(circle at 50% 50%,#f8fafc,#e2e8f0)}
.train-container{position:relative;width:100%;height:120px;backdrop-filter:blur(16px);overflow:hidden;display:flex;align-items:center;transition:.4s}
.dark .train-container{background:rgba(15,23,42,.7);border-bottom:1px solid rgba(56,189,248,.25)}html:not(.dark) .train-container{background:rgba(255,255,255,.7);border-bottom:1px solid rgba(226,232,240,1)}
.train-runner{position:absolute;display:flex;align-items:center;gap:24px;white-space:nowrap;animation:run 20s linear infinite}@keyframes run{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.gt{background:linear-gradient(90deg,#38bdf8,#818cf8,#34d399,#38bdf8);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientMove 5s ease infinite}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.glass-card{position:relative;backdrop-filter:blur(20px);border-radius:1.25rem;transition:all .35s;overflow:hidden}.dark .glass-card{background:rgba(15,23,42,.65);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.4);color:#f8fafc}
.dark .glass-card:hover{border-color:rgba(56,189,248,.45)}html:not(.dark) .glass-card{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);box-shadow:0 10px 30px rgba(0,0,0,.06);color:#0f172a}
html:not(.dark) .glass-card:hover{border-color:rgba(14,165,233,.4)}.input-bg{transition:.3s}.dark .input-bg{background-color:rgba(2,6,23,.8);border:1px solid rgba(51,65,85,.8);color:#f8fafc}
html:not(.dark) .input-bg{background-color:#fff;border:1px solid #cbd5e1;color:#0f172a}.modal-backdrop{transition:.3s;opacity:1;visibility:visible}.modal-backdrop.hidden-modal{opacity:0;pointer-events:none;visibility:hidden}
</style>
</head>
<body id="appBody" class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center select-none">
<div class="ambient-bg"></div>
<div class="train-container"><div id="trainTrack" class="train-runner flex items-center gap-6 px-4"></div></div>
<div class="max-w-6xl mx-auto w-full px-4 pt-4 pb-16 space-y-4">
  <header class="text-center space-y-1.5 relative">
    <button onclick="document.documentElement.classList.toggle('dark');let isDark=document.documentElement.classList.contains('dark');document.getElementById('themeIcon').className=isDark?'fa-solid fa-sun text-lg text-amber-400':'fa-solid fa-moon text-lg text-indigo-600';" class="absolute top-0 right-0 p-2 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 shadow-lg flex items-center justify-center w-9 h-9 transition hover:scale-105"><i id="themeIcon" class="fa-solid fa-moon text-base text-indigo-600"></i></button>
    <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full shadow-xl glass-card">
      <img src="https://cdn-icons-png.flaticon.com/512/387/387561.png" class="w-6 h-6 rounded-full border border-cyan-400 object-cover"><h1 class="text-xl font-black"><span class="gt">MyDoctorG</span></h1>
    </div>
  </header>
  <div class="flex justify-center items-center gap-2.5 flex-wrap">
    <button onclick="toggleModal('sosModal')" class="bg-gradient-to-r from-rose-600 to-red-600 text-white px-3.5 py-1 rounded-full text-xs font-bold animate-pulse shadow-lg"><i class="fa-solid fa-bell text-amber-300"></i> SOS</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
    <div id="appointmentCard" class="glass-card p-4 space-y-2.5 border-indigo-500/20 flex flex-col justify-between h-full min-h-[300px]">
      <div class="space-y-2">
        <h2 class="text-[11px] font-extrabold uppercase text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5"><i class="fa-solid fa-calendar-check text-indigo-500"></i> Doctor Appointment Scheduler</h2>
        <div class="grid grid-cols-2 gap-2"><input id="aptDoctor" placeholder="Doctor Name" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"><input id="aptSpecialty" placeholder="Specialty (e.g. Cardio)" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"></div>
        <div class="grid grid-cols-2 gap-2"><input id="aptDate" type="date" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"><input id="aptTime" type="time" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"></div>
        <button onclick="addAppointment()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 py-2 rounded-lg font-bold text-white text-[11px] shadow-md transition"><i class="fa-solid fa-plus mr-1"></i> Schedule Appointment</button>
      </div>
      <div id="appointmentList" class="space-y-1.5 text-[11px] pt-1 flex-1 overflow-y-auto max-h-[120px]"></div>
    </div>
    <div id="medCard" class="glass-card p-4 space-y-2.5 flex flex-col justify-between h-full min-h-[300px]">
      <div class="space-y-2">
        <h2 class="text-[11px] font-extrabold uppercase text-amber-600 dark:text-amber-400"><i class="fa-solid fa-pills"></i> Smart Medication Alarm</h2>
        <div class="grid grid-cols-3 gap-2"><input id="mName" placeholder="Medicine" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"><input id="mDose" placeholder="Dose" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"><input id="mTime" type="time" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"></div>
        <button onclick="addMed()" class="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded-lg font-bold text-white text-[11px] transition shadow-md">Add Pill Reminder</button>
      </div>
      <div id="medList" class="space-y-1.5 text-[11px] flex-1 overflow-y-auto max-h-[120px]"></div>
    </div>
    <div id="docCard" class="glass-card p-4 space-y-2.5 flex flex-col justify-between h-full min-h-[300px]">
      <div class="space-y-2">
        <div class="flex items-center justify-between"><h2 class="text-[11px] font-extrabold uppercase text-cyan-600 dark:text-cyan-400 flex items-center gap-1.5"><i class="fa-solid fa-user-doctor"></i> Find Doctors & Specialists</h2><span class="text-[9px] bg-cyan-100 dark:bg-cyan-950/80 text-cyan-700 dark:text-cyan-300 border border-cyan-500/30 px-1.5 py-0.2 rounded-full font-bold">Live Search</span></div>
        <div class="flex items-center gap-1 overflow-x-auto pb-1 text-[10px] scrollbar-none">
          <button onclick="quickSearchSpec('Cardiologist')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-700 shrink-0">🫀 Cardio</button>
          <button onclick="quickSearchSpec('Eye Specialist')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-700 shrink-0">👁️ Eye</button>
          <button onclick="quickSearchSpec('Pediatrician')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-700 shrink-0">👶 Child</button>
          <button onclick="quickSearchSpec('Dermatologist')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-700 shrink-0">🩺 Skin</button>
          <button onclick="quickSearchSpec('General Physician')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-2 py-0.5 rounded-md border border-slate-300 dark:border-slate-700 shrink-0">👨‍⚕️ General</button>
        </div>
        <div class="grid grid-cols-2 gap-2"><input id="c" value="Bengaluru" placeholder="City / Location" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none focus:border-cyan-500"><input id="d" value="General Physician" placeholder="Specialty / Keyword" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none focus:border-cyan-500"></div>
        <button onclick="searchDocs()" id="btn" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded-lg font-bold text-white text-[11px] transition shadow-md flex items-center justify-center gap-1.5"><i class="fa-solid fa-magnifying-glass"></i> Search Specialists</button>
      </div>
      <div id="r" class="text-[11px] space-y-1.5 pt-1 flex-1 overflow-y-auto max-h-[110px]"></div>
    </div>
    <div id="bmiCard" class="glass-card p-4 space-y-2.5 flex flex-col justify-between h-full min-h-[300px]">
      <div class="space-y-2">
        <h2 class="text-[11px] font-extrabold uppercase text-pink-600 dark:text-pink-400"><i class="fa-solid fa-calculator"></i> BMI Calculator</h2>
        <div class="grid grid-cols-2 gap-2"><input id="bmiWeight" type="number" placeholder="Weight (kg)" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"><input id="bmiHeight" type="number" placeholder="Height (cm)" class="input-bg px-2.5 py-1.5 rounded-lg text-[11px] outline-none"></div>
        <button onclick="calculateBMI()" class="w-full bg-pink-600 py-2 rounded-lg font-bold text-white text-[11px] shadow-md">Calculate BMI</button>
      </div>
      <div id="bmiResult" class="hidden p-2.5 bg-slate-900 text-white border border-pink-500/30 rounded-lg text-[11px]"></div>
    </div>
    <div id="aiCard" class="glass-card p-4 space-y-2.5 flex flex-col justify-between h-full min-h-[300px] md:col-span-2 md:w-1/2 md:mx-auto">
      <div class="flex items-center justify-between"><h2 class="text-[11px] font-extrabold uppercase text-indigo-600 dark:text-indigo-400"><i class="fa-solid fa-robot"></i> AI Health Assistant</h2><button onclick="clearChatSession()" class="text-[9px] bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded-md">New</button></div>
      <div id="chat" class="h-32 overflow-y-auto bg-slate-100 dark:bg-slate-950/80 p-2.5 rounded-xl text-[11px] space-y-2 flex flex-col border border-slate-300 dark:border-slate-800 flex-1"><div class="bg-white dark:bg-slate-800/95 text-slate-800 dark:text-white shadow-sm p-2 rounded-xl max-w-[85%]">Hello! How can I help evaluate your symptoms today?</div></div>
      <div class="flex gap-2 pt-0.5"><input id="txt" placeholder="Describe symptoms..." onkeydown="if(event.key==='Enter')sendChat()" class="input-bg flex-1 px-3 py-1.5 rounded-lg text-[11px] outline-none"><button onclick="sendChat()" class="bg-indigo-600 px-3 py-1.5 rounded-lg text-white text-xs"><i class="fa-solid fa-paper-plane"></i></button></div>
    </div>
  </div>
</div>
<div id="sosModal" class="modal-backdrop hidden-modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
  <div class="glass-card border-2 border-rose-500 w-full max-w-sm rounded-2xl p-5 text-center relative">
    <button onclick="toggleModal('sosModal')" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
    <h3 class="font-black text-rose-500 text-xs mb-3">EMERGENCY HOTLINES</h3>
    <div class="space-y-2">
      <a href="tel:108" class="flex items-center justify-between p-2.5 bg-rose-950 border border-rose-500 rounded-lg font-bold text-[11px] text-white"><span>Ambulance</span><span class="bg-rose-600 px-2.5 py-0.5 rounded-full text-white">Call 108</span></a>
      <a href="tel:112" class="flex items-center justify-between p-2.5 bg-blue-950 border border-blue-500 rounded-lg font-bold text-[11px] text-white"><span>Emergency</span><span class="bg-blue-600 px-2.5 py-0.5 rounded-full text-white">Call 112</span></a>
    </div>
  </div>
</div>
<div id="alarmAlertModal" class="modal-backdrop hidden-modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
  <div class="glass-card border-2 border-amber-400 w-full max-w-xs rounded-2xl p-5 text-center relative space-y-2.5 shadow-2xl">
    <div class="w-11 h-11 bg-amber-500/20 rounded-full border border-amber-400/40 flex items-center justify-center mx-auto text-amber-300 text-xl animate-bounce"><i id="alarmModalIcon" class="fa-solid fa-bell"></i></div>
    <h3 id="alarmModalTitle" class="font-black text-amber-500 dark:text-amber-400 text-sm">Health Reminder</h3>
    <p id="alarmModalMsg" class="text-[11px] bg-slate-100 dark:bg-slate-950/80 p-2 rounded-lg border border-slate-300 dark:border-slate-800">Time to take your medication.</p>
    <button onclick="toggleModal('alarmAlertModal')" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-lg text-[11px] hover:bg-amber-400 transition">Acknowledge Alert</button>
  </div>
</div>
<script>
let soundEnabled=JSON.parse(localStorage.getItem('mg_sound')??'true'), triggeredReminders=new Set(), hist=[];
firebase.initializeApp({apiKey:"AIzaSyCy5KggVWF7xWFUuCojZ96ZVlrF292P77s",authDomain:"mydoctorg-292cf.firebaseapp.com",projectId:"mydoctorg-292cf"});
const K="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", U="https://api.groq.com/openai/v1/chat/completions", M="openai/gpt-oss-120b";
function toggleModal(id){const m=document.getElementById(id);if(m)m.classList.toggle('hidden-modal');}
function playBeepSound(){if(!soundEnabled)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(587.33,ctx.currentTime);osc.frequency.setValueAtTime(880,ctx.currentTime+0.15);gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.4);}catch(e){}}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('mg_sound',JSON.stringify(soundEnabled));}
function triggerSystemNotification(t,m,i="fa-bell"){playBeepSound();if("Notification" in window&&Notification.permission==="granted"){try{new Notification(t,{body:m,icon:"https://cdn-icons-png.flaticon.com/512/387/387561.png"});}catch(e){}}document.getElementById('alarmModalTitle').innerText=t;document.getElementById('alarmModalMsg').innerText=m;document.getElementById('alarmModalIcon').className=`fa-solid ${i}`;const modal=document.getElementById('alarmAlertModal');if(modal&&modal.classList.contains('hidden-modal'))toggleModal('alarmAlertModal');}
setInterval(()=>{const n=new Date(),c=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,m=JSON.parse(localStorage.getItem('mg_meds')||'[]');m.forEach(x=>{const k=`med_${x.name}_${x.time}_${n.toDateString()}_${c}`;if(x.time===c&&!triggeredReminders.has(k)){triggeredReminders.add(k);triggerSystemNotification("💊 Medication Time",`It is time to take ${x.name} (${x.dose})!`,"fa-pills");}});const a=JSON.parse(localStorage.getItem('mg_apts')||'[]');a.forEach(x=>{const t=new Date(`${x.date}T${x.time}`),df=t.getTime()-n.getTime(),ke=`apt_exact_${x.doctor}_${x.date}_${x.time}`,k15=`apt_15min_${x.doctor}_${x.date}_${x.time}`;if(df>0&&df<=900000&&!triggeredReminders.has(k15)){triggeredReminders.add(k15);triggerSystemNotification("🩺 Appointment Coming Up",`Dr. ${x.doctor} (${x.specialty}) consultation in 15 minutes!`,"fa-user-doctor");}if(Math.abs(df)<=30000&&!triggeredReminders.has(ke)){triggeredReminders.add(ke);triggerSystemNotification("🩺 Appointment Now",`Your appointment with Dr. ${x.doctor} starts now!`,"fa-calendar-check");}});renderAppointments();},10000);
function addAppointment(){const d=document.getElementById("aptDoctor").value.trim(),s=document.getElementById("aptSpecialty").value.trim()||'General Specialist',dt=document.getElementById("aptDate").value,tm=document.getElementById("aptTime").value;if(!d||!dt||!tm)return alert("Please specify doctor name, date, and time.");const a=JSON.parse(localStorage.getItem('mg_apts')||'[]');a.push({doctor:d,specialty:s,date:dt,time:tm});localStorage.setItem('mg_apts',JSON.stringify(a));document.getElementById("aptDoctor").value="";document.getElementById("aptSpecialty").value="";document.getElementById("aptDate").value="";document.getElementById("aptTime").value="";renderAppointments();}
function deleteAppointment(i){const a=JSON.parse(localStorage.getItem('mg_apts')||'[]');a.splice(i,1);localStorage.setItem('mg_apts',JSON.stringify(a));renderAppointments();}
function renderAppointments(){const c=document.getElementById("appointmentList"),a=JSON.parse(localStorage.getItem('mg_apts')||'[]');if(!a.length){c.innerHTML=`<p class="text-slate-500 dark:text-slate-400 text-[10px] text-center py-1">No doctor appointments scheduled.</p>`;return;}const n=new Date();c.innerHTML=a.map((x,i)=>{const t=new Date(`${x.date}T${x.time}`),df=t.getTime()-n.getTime();let b=df<0?`<span class="bg-rose-500/20 text-rose-600 dark:text-rose-300 border border-rose-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold">Past Due</span>`:(Math.floor(df/3600000)<24?`<span class="bg-amber-500/20 text-amber-600 dark:text-amber-300 border border-amber-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold">In ${Math.floor(df/3600000)}h ${Math.floor((df%3600000)/60000)}m</span>`:`<span class="bg-cyan-500/20 text-cyan-600 dark:text-cyan-300 border border-cyan-500/30 px-1.5 py-0.2 rounded text-[9px] font-bold">In ${Math.floor(df/86400000)} days</span>`);return `<div class="p-2 rounded-lg border border-indigo-500/20 flex items-center justify-between"><div class="space-y-0.5"><div class="font-bold flex items-center gap-1.5">Dr. ${x.doctor} <span class="text-[9px] font-normal text-indigo-600 dark:text-indigo-400">(${x.specialty})</span></div><div class="text-[9px] opacity-75"><i class="fa-regular fa-clock mr-1"></i>${x.date} at ${x.time}</div></div><div class="flex items-center gap-1.5">${b}<button onclick="deleteAppointment(${i})" class="text-rose-500 hover:text-rose-700 p-0.5"><i class="fa-solid fa-trash"></i></button></div></div>`;}).join('');}

async function callAI(m){try{let r=await fetch(U,{method:"POST",headers:{"Authorization":`Bearer ${K}`,"Content-Type":"application/json"},body:JSON.stringify({model:M,messages:m,temperature:0.2})}),d=await r.json();return d.choices?.[0]?.message?.content||"No response.";}catch(e){return "Service error.";}}
function clearChatSession(){hist=[];document.getElementById('chat').innerHTML=`<div class="bg-white dark:bg-slate-800/90 text-slate-800 dark:text-white p-2 rounded-xl max-w-[85%] text-[11px] shadow-sm">Hello! How can I help you today?</div>`;}
async function sendChat(){let i=document.getElementById("txt"),m=i.value.trim(),b=document.getElementById("chat");if(!m)return;b.innerHTML+=`<div class="bg-indigo-600 text-white p-2 rounded-xl max-w-[85%] self-end text-[11px] shadow-md">${m}</div>`;i.value="";hist.push({role:"user",content:m});let d=document.createElement("div");d.className="bg-white dark:bg-slate-800/90 text-slate-800 dark:text-white p-2 rounded-xl max-w-[85%] text-[11px] shadow-sm";d.innerHTML=`Evaluating...`;b.appendChild(d);b.scrollTop=b.scrollHeight;let reply=await callAI([{role:"system",content:"You are MyDoctorG AI. Keep advice concise."},...hist]);hist.push({role:"assistant",content:reply});d.innerHTML=`<span>${reply}</span>`;let s=JSON.parse(localStorage.getItem('mg_s')||'[]');s.unshift({q:m,a:reply});localStorage.setItem('mg_s',JSON.stringify(s.slice(0,10)));b.scrollTop=b.scrollHeight;}
async function searchDocs(){let c=document.getElementById("c").value.trim(),d=document.getElementById("d").value.trim(),r=document.getElementById("r");if(!c||!d)return alert("Please enter city and doctor specialty.");r.innerHTML=`<div class="p-2 rounded-lg border border-cyan-500/20 text-cyan-600 dark:text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-spinner animate-spin"></i> Finding specialists for ${d} in ${c}...</div>`;let raw=await callAI([{role:"system",content:"Return ONLY valid JSON format with array of 3 realistic doctors or healthcare clinics: {\"doctors\":[{\"name\":\"\",\"specialty\":\"\",\"hospital\":\"\",\"rating\":\"4.8\"}]}"},{role:"user",content:`Find 3 top doctors for ${d} in ${c}.`}]);try{let js=JSON.parse(raw.replace(/```json|```/g,'').trim());if(!js.doctors||!js.doctors.length)throw new Error("No doctors");r.innerHTML=js.doctors.map(x=>`<div class="p-2 rounded-lg border border-cyan-500/35 flex justify-between items-center gap-2 bg-white/50 dark:bg-slate-900/40"><div class="space-y-0.5"><div class="flex items-center gap-1.5"><b class="text-cyan-700 dark:text-cyan-400 font-extrabold text-[11px]">Dr. ${x.name}</b><span class="bg-amber-500/20 text-amber-700 dark:text-amber-300 text-[9px] px-1 py-0.2 rounded border border-amber-500/30 font-bold">★ ${x.rating||'4.8'}</span></div><span class="block opacity-80 text-[10px]">${x.hospital}</span><span class="block opacity-60 text-[9px]">${x.specialty||d}</span></div></div>`).join('');}catch(e){r.innerHTML=`<div class='p-2 bg-rose-950/40 border border-rose-500/30 rounded-lg text-rose-500 text-[10px]'>Unable to fetch doctor list. Please try again.</div>`;}}
function quickSearchSpec(s){document.getElementById('d').value=s;searchDocs();}
function calculateBMI(){let w=parseFloat(document.getElementById("bmiWeight").value),h=parseFloat(document.getElementById("bmiHeight").value),res=document.getElementById("bmiResult");if(!w||!h)return alert("Enter valid numbers.");let bmi=(w/((h/100)*(h/100))).toFixed(1);res.classList.remove("hidden");res.innerHTML=`<strong>BMI: ${bmi}</strong> | Water: ~${(w*0.033).toFixed(1)}L`;}
function renderMeds(){let l=document.getElementById("medList"),meds=JSON.parse(localStorage.getItem('mg_meds')||'[]');l.innerHTML=meds.length?meds.map((x,i)=>`<div class="flex justify-between p-2 rounded-lg border border-slate-300 dark:border-slate-700 items-center bg-white/50 dark:bg-slate-900/40"><span><b>${x.name}</b> (${x.dose}) at ${x.time}</span><button onclick="deleteMed(${i})" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`).join(''):'<p class="opacity-60 text-slate-500 text-[10px]">No meds logged.</p>';}
function addMed(){let n=document.getElementById("mName").value,d=document.getElementById("mDose").value,t=document.getElementById("mTime").value;if(!n||!t)return alert("Provide name & time.");let meds=JSON.parse(localStorage.getItem('mg_meds')||'[]');meds.push({name:n,dose:d||'1 tab',time:t});localStorage.setItem('mg_meds',JSON.stringify(meds));renderMeds();}
function deleteMed(i){let meds=JSON.parse(localStorage.getItem('mg_meds')||'[]');meds.splice(i,1);localStorage.setItem('mg_meds',JSON.stringify(meds));renderMeds();}
